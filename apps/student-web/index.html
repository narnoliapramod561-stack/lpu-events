<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070a" />
    
    <!-- Preconnect & High-Performance Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />

    <!-- Primary SEO Metadata -->
    <title>LPU Events — Discover Campus Events, Clubs & Festivities</title>
    <meta name="description" content="Discover and participate in student events, workshops, technical competitions, cultural fests, clubs, and campus life at Lovely Professional University." />
    <meta name="keywords" content="LPU Events, Lovely Professional University, Campus Events, Student Clubs, Workshops, Hackathons, Fests" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://lpuevents.live/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lpuevents.live/" />
    <meta property="og:site_name" content="LPU Events" />
    <meta property="og:title" content="LPU Events — Student Discovery Hub" />
    <meta property="og:description" content="Your central hub for discovering and participating in the vibrant campus life at Lovely Professional University." />
    <meta property="og:image" content="https://lpuevents.live/logo.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LPU Events — Discover Campus Life" />
    <meta name="twitter:description" content="Discover and participate in student events, workshops, clubs, and campus life at Lovely Professional University." />
    <meta name="twitter:image" content="https://lpuevents.live/logo.jpeg" />

    <!-- Google Search Console Verification (configured dynamically or via build) -->
    <meta name="google-site-verification" content="" />

    <!-- Google AdSense Library (Async & Sandboxed) -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
